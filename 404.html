<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lumo — страница не найдена</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#171A2A;color:#E8EBF6;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
main{text-align:center;padding:24px;max-width:480px}
h1{font-size:20px;margin:0 0 10px;letter-spacing:.02em}
a{color:#A7C7FF}
p{margin:0;color:#B9C0D8}
</style>
</head>
<body>
<main>
<h1>404 — страница не найдена</h1>
<p>Через 3 секунды вы будете перенаправлены в приложение Lumo.<br>
Если этого не произошло — <a id="home-link" href="./">перейдите на главную</a>.</p>
</main>
<script>
// GitHub Pages: сайт может жить как в корне (username.github.io),
// так и в подпапке проекта (username.github.io/repo/).
// Вычисляем корень сайта по первому сегменту пути.
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  var root = parts.length > 1 ? '/' + parts[0] + '/' : '/';
  var a = document.getElementById('home-link');
  if (a) { a.href = root; }
  setTimeout(function () { location.replace(root); }, 3000);
})();
</script>
<noscript><meta http-equiv="refresh" content="3; url=./"></noscript>
</body>
</html>
