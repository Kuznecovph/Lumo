 if(m.type==='task')form=`<form id="modal-form" data-form="task" class="modal-grid"><div class="field"><label for="task-name">Что нужно сделать *</label><input class="input" id="task-name" name="title" maxlength="150" required placeholder="Например, написать маркетологу" value="${esc(m.title||'')}"></div><div class="field"><label for="task-company">Компания</label><select class="input" id="task-company" name="companyId"><option value="">Без привязки</option>${db.companies.map(x=>`<option value="${esc(x.id)}" ${x.id===m.companyId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label for="task-due">Дата выполнения *</label><input class="input" type="date" id="task-due" name="due" required value="${esc(m.due||today)}"></div><div class="form-error" id="modal-error"></div><div class="modal-footer"><button type="button" class="btn" data-action="close-modal">Отмена</button><button type="submit" class="btn primary">Сохранить задачу</button></div></form>`;
 if(m.type==='company')form=`<form id="modal-form" data-form="company" class="modal-grid"><div class="field"><label for="new-name">Название компании *</label><input class="input" id="new-name" name="name" required maxlength="150" placeholder="Например, агрофирма «Рассвет»"></div><div class="select-grid"><div class="field"><label for="new-region">Регион *</label><select class="input" id="new-region" name="region" required>${REGIONS.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('')}</select></div><div class="field"><label for="new-sector">Отрасль *</label><select class="input" id="new-sector" name="sector">${SECTORS.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('')}</select></div></div><div class="field"><label for="new-town">Населённый пункт *</label><input class="input" id="new-town" name="town" maxlength="120" required placeholder="Город, село, деревня или посёлок"></div><div class="field"><label for="new-reason">Повод для обращения</label><textarea class="input" name="reason" id="new-reason" maxlength="400" placeholder="Например, открывается новое производство"></textarea></div><div class="form-error" id="modal-error"></div><div class="modal-footer"><button type="button" class="btn" data-action="close-modal">Отмена</button><button type="submit" class="btn primary">Добавить компанию</button></div></form>`;
 if(m.type==='payment')form=`<form id="modal-form" data-form="payment" class="modal-grid"><div class="field"><label for="payment-company">Компания *</label><select class="input" id="payment-company" name="companyId" required><option value="">Выберите компанию</option>${db.companies.map(x=>`<option value="${esc(x.id)}" ${m.companyId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="select-grid"><div class="field"><label for="payment-amount">Получено, ₽ *</label><input class="input" id="payment-amount" type="number" name="amount" min="1" max="1000000000" step="1" required placeholder="Например, 30000"></div><div class="field"><label for="payment-date">Дата оплаты *</label><input class="input" id="payment-date" type="date" name="date" required value="${today}"></div></div><div class="field"><label for="payment-comment">За что оплатили?</label><input class="input" id="payment-comment" name="comment" maxlength="180" placeholder="Например, фото производства"></div><div class="form-error" id="modal-error"></div><div class="modal-footer"><button type="button" class="btn" data-action="close-modal">Отмена</button><button type="submit" class="btn primary">Учесть оплату</button></div></form>`;
 if(m.type==='reschedule'){const t=db.tasks.find(x=>x.id===m.taskId);form=`<form id="modal-form" data-form="reschedule" class="modal-grid"><div class="muted small">${esc(t?.title||'Задача')}</div><div class="field"><label for="reschedule-date">Новая дата *</label><input type="date" class="input" name="due" id="reschedule-date" required value="${esc(t?.due||today)}"></div><div class="modal-footer"><button type="button" class="btn" data-action="close-modal">Отмена</button><button type="submit" class="btn primary">Перенести</button></div></form>`}
 const title=({task:'Новая задача',company:'Новая компания',payment:'Учесть оплату',reschedule:'Перенести задачу'})[m.type];return `<div class="overlay" id="modal-overlay" data-action="overlay-click"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">${title}</h2><p>${m.type==='payment'?'Сумма появится в отчёте о результатах.':m.type==='company'?'Новая компания добавится в локальную демонстрационную базу.':'Изменения сохраняются только в этом браузере.'}</p></div><button class="icon-btn" data-action="close-modal" aria-label="Закрыть окно">${icon('x')}</button></div>${form}</section></div>`;
}
const displayPages={home,companies,company:companyPage,search:searchPage,events:eventsPage,event:eventPage,tasks:tasksPage,results:resultsPage,settings:settingsPage};
function syncRoute(){let hash;try{hash=decodeURIComponent((location.hash||'#/home').replace(/^#\//,''))}catch(e){hash='home'}const [view,id]=hash.split('/');ui.view=displayPages[view]?view:'home';ui.companyId=ui.view==='company'?safeId(id):null;ui.eventId=ui.view==='event'?safeId(id):null;}
function render(opts={}){syncRoute();document.body.classList.toggle('compact',!!db.settings.compact);const app=document.getElementById('app');const content=displayPages[ui.view]();app.innerHTML=shell(content);document.title='Lumo 4.0 · '+({home:'Главная',companies:'Компании',company:'Карточка компании',search:'Поиск',events:'События',event:'Событие',tasks:'Задачи',results:'Результаты',settings:'Настройки'}[ui.view]||'Прототип');if(opts.focus){let elem=app.querySelector(opts.focus);if(elem){elem.focus({preventScroll:true});if(opts.cursor!==undefined&&typeof elem.setSelectionRange==='function')try{elem.setSelectionRange(opts.cursor,opts.cursor)}catch(e){}}}if(ui.modal&&opts.modalFocus!==false){app.querySelector('.modal input:not([type=hidden]),.modal select,.modal button')?.focus({preventScroll:true})}}
function goto(view,id=''){ui.modal=null;const hash='#/'+view+(id?'/'+encodeURIComponent(id):'');if(location.hash===hash){render();window.scrollTo(0,0)}else location.hash=hash;}
function openModal(type,options={}){ui.modal={type,...options};render();}
function closeModal(){ui.modal=null;render({modalFocus:false});}
function mutateTask(id){const t=db.tasks.find(t=>t.id===id);if(!t)return;t.done=!t.done;save();render();toast(t.done?'Задача выполнена':'Задача снова открыта')}
function submitModal(e){e.preventDefault();const type=e.target.dataset.form;const fd=new FormData(e.target);const bad=message=>{const el=document.getElementById('modal-error');if(el)el.textContent=message;toast(message)};const str=(key,max=300)=>String(fd.get(key)||'').trim().slice(0,max);
 if(type==='task'){let title=str('title',150),companyId=str('companyId',90),due=str('due',10);if(!title||!/\d{4}-\d{2}-\d{2}/.test(due)||(companyId&&!company(companyId)))return bad('Укажите название, корректную дату и компанию.');db.tasks.unshift({id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),title,companyId,due,done:false});save();ui.modal=null;render();toast('Задача создана');return}
 if(type==='company'){const name=str('name',150),region=str('region',30),town=str('town',120),sector=str('sector',40),reason=str('reason',400);if(!name||!town||!REGIONS.includes(region)||!SECTORS.includes(sector))return bad('Заполните название, населённый пункт, регион и отрасль.');const id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);db.companies.push({id,name,region,town,sector,stage:'found',reason,content:'Предложение ещё не определено.',marketing:'unknown',photoMonths:null,videoMonths:null,socialMonths:null,finance:'unknown',financeNote:'Данные для проверки не получены.',priority:'medium',contact:'',note:'',eventIds:[]});save();ui.modal=null;goto('company',id);toast('Компания добавлена в локальную базу');return}
 if(type==='payment'){let companyId=str('companyId',100),amt=Number(fd.get('amount')),date=str('date',10),comment=str('comment',180);if(!company(companyId)||!Number.isSafeInteger(amt)||amt<=0||amt>1000000000||!/^\d{4}-\d{2}-\d{2}$/.test(date))return bad('Выберите компанию, укажите корректную сумму и дату.');db.payments.push({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),companyId,amount:amt,date,comment});save();ui.modal=null;render();toast('Оплата учтена');return}
 if(type==='reschedule'){const t=db.tasks.find(t=>t.id===ui.modal.taskId),due=str('due',10);if(!t||!/^\d{4}-\d{2}-\d{2}$/.test(due))return bad('Укажите дату.');t.due=due;save();ui.modal=null;render();toast('Срок задачи изменён')}
}
document.addEventListener('submit',e=>{if(e.target.id==='modal-form')submitModal(e)});
document.addEventListener('click',e=>{
 const trigger=e.target.closest('[data-action]');if(trigger){const a=trigger.dataset.action,id=trigger.dataset.id||'',value=trigger.dataset.value||'';
 if(a==='overlay-click'){if(e.target===trigger)closeModal();return}
 if(a==='close-modal'){closeModal();return}
 if(a==='go'){goto(id);return}
 if(a==='modal-task'){openModal('task',{companyId:id});return}
 if(a==='modal-company'){openModal('company');return}
 if(a==='modal-payment'){openModal('payment',{companyId:id});return}
 if(a==='finance-task'){openModal('task',{companyId:id,title:'Проверить долги, суды и кредитную нагрузку'});return}
 if(a==='event-task'){const ev=event(id);openModal('task',{title:ev?'Проверить программу и участников: '+ev.name:'Проверить мероприятие'});return}
 if(a==='event'){goto('event',id);return}
 if(a==='toggle-task'){mutateTask(id);return}
 if(a==='stage'){const c=company(id);if(c&&PHASES[value]){c.stage=value;save();render();toast('Этап изменён: '+PHASES[value])}return}
 if(a==='save-company-notes'){const c=company(id);if(c){c.note=(document.getElementById('note-edit')?.value||'').slice(0,12000);c.contact=(document.getElementById('contact-edit')?.value||'').slice(0,250);save();render();toast('Контакт и заметка сохранены')}return}
 if(a==='region'){ui.filter.region=id;render();return}
 if(a==='event-region'){ui.eventRegion=id;render();return}
 if(a==='task-filter'){ui.taskFilter=id;render();return}
 if(a==='clear-filters'){ui.filter={q:'',region:'',sector:'',stage:'',finance:'',sort:'priority',reasonOnly:false};render();return}
 if(a==='reset-search'){ui.search={q:'',region:'',sector:'',hasEvent:false,activeOnly:false};render();return}
 if(a==='run-search'){document.getElementById('search-output')?.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(a==='reschedule'){openModal('reschedule',{taskId:id});return}
 if(a==='delete-task'){if(confirm('Удалить эту задачу?')){db.tasks=db.tasks.filter(t=>t.id!==id);save();render();toast('Задача удалена')}return}
 if(a==='delete-payment'){if(confirm('Удалить оплату из журнала?')){db.payments=db.payments.filter(p=>p.id!==id);save();render();toast('Оплата удалена')}return}
 if(a==='reset-data'){if(confirm('Сбросить все изменения и восстановить примерные данные? Это удалит ваши записи из прототипа.')){db=seed();save();ui.filter={q:'',region:'',sector:'',stage:'',finance:'',sort:'priority',reasonOnly:false};render();toast('Демо восстановлено')}return}
 if(a==='export-data'){const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),source:'Lumo UI Prototype v4',data:db},null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='lumo-4-prototype-data-'+iso()+'.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Резервная копия скачана');return}
 }
 const tr=e.target.closest('tr[data-open]');if(tr&&!e.target.closest('a,button,input,select')){goto('company',tr.dataset.open)}
});
let inputTimer;
document.addEventListener('input',e=>{const path=e.target.dataset.query;if(!path)return;const [scope,key]=path.split('.');if(!ui[scope]||!['filter','search'].includes(scope))return;ui[scope][key]=e.target.value;const pos=e.target.selectionStart;clearTimeout(inputTimer);inputTimer=setTimeout(()=>render({focus:`[data-query="${path}"]`,cursor:pos,modalFocus:false}),120)});
document.addEventListener('change',e=>{const sel=e.target.dataset.select;if(sel){const [scope,key]=sel.split('.');if(ui[scope]){ui[scope][key]=e.target.value;render()}return}const tog=e.target.dataset.toggle;if(tog){const [scope,key]=tog.split('.');if(scope==='settings'){db.settings[key]=e.target.checked;save();render()}else if(ui[scope]){ui[scope][key]=e.target.checked;render()}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){closeModal()}});
window.addEventListener('hashchange',()=>{ui.modal=null;render();window.scrollTo({top:0,behavior:'instant'})});
if(!location.hash)location.hash='#/home';render();
</script>
</body>
</html>
